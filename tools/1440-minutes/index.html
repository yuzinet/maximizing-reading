<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1440分の使い方 - 今日の残り時間</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #888;
      margin-bottom: 3rem;
      text-align: center;
    }

    .countdown {
      text-align: center;
      margin-bottom: 3rem;
    }

    .countdown-time {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .countdown-time.warning {
      color: #f59e0b;
    }

    .countdown-time.danger {
      color: #ef4444;
    }

    .countdown-label {
      font-size: 0.85rem;
      color: #555;
      margin-top: 0.75rem;
      letter-spacing: 0.1em;
    }

    .progress-bar-wrap {
      width: min(500px, 100%);
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin: 2rem auto;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #f0f0f0;
      border-radius: 2px;
      transition: width 1s linear, background 1s;
    }

    .progress-bar.warning {
      background: #f59e0b;
    }

    .progress-bar.danger {
      background: #ef4444;
    }

    .stats {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #555;
      margin-top: 0.25rem;
      letter-spacing: 0.08em;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .setting label {
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.05em;
    }

    .setting input[type="time"] {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-size: 1rem;
      padding: 0.4rem 0.75rem;
      outline: none;
      cursor: pointer;
    }

    .setting input[type="time"]:focus {
      border-color: #555;
    }

    .message {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #444;
      text-align: center;
      min-height: 1.2em;
      letter-spacing: 0.05em;
    }

    .done-message {
      font-size: 1.1rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>1440分の使い方 — 今日の残り時間</h1>

  <div class="countdown">
    <div class="countdown-time" id="countdown">--:--:--</div>
    <div class="countdown-label">就寝まで</div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress" style="width: 100%"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="minutes-left">--</div>
      <div class="stat-label">残り分</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="percent-left">--%</div>
      <div class="stat-label">残り割合</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="elapsed">--</div>
      <div class="stat-label">経過分</div>
    </div>
  </div>

  <div class="setting">
    <label for="bedtime">就寝時刻</label>
    <input type="time" id="bedtime" value="23:00">
  </div>

  <div class="message" id="message"></div>

  <script>
    const DEFAULT_START = "06:00";

    const countdownEl = document.getElementById("countdown");
    const progressEl = document.getElementById("progress");
    const minutesLeftEl = document.getElementById("minutes-left");
    const percentLeftEl = document.getElementById("percent-left");
    const elapsedEl = document.getElementById("elapsed");
    const bedtimeInput = document.getElementById("bedtime");
    const messageEl = document.getElementById("message");

    const STORAGE_KEY = "maximizing-reading-bedtime";

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) bedtimeInput.value = saved;

    bedtimeInput.addEventListener("change", () => {
      localStorage.setItem(STORAGE_KEY, bedtimeInput.value);
    });

    function parseTime(timeStr) {
      const [h, m] = timeStr.split(":").map(Number);
      return { h, m };
    }

    function getStartMinutes() {
      const { h, m } = parseTime(DEFAULT_START);
      return h * 60 + m;
    }

    function getBedtimeMinutes() {
      const val = bedtimeInput.value || "23:00";
      const { h, m } = parseTime(val);
      let mins = h * 60 + m;
      return mins;
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function getMessages(remainingMins) {
      if (remainingMins > 240) return "まだ時間はある。何に使うか決めよう。";
      if (remainingMins > 120) return "残り2時間以上。集中できるラストスパート。";
      if (remainingMins > 60)  return "残り1時間以上。今日一番大事なことに使おう。";
      if (remainingMins > 30)  return "残り30分超。ルーティンを終わらせよう。";
      if (remainingMins > 10)  return "あと少し。明日の準備を。";
      if (remainingMins > 0)   return "もう休む時間だ。";
      return "";
    }

    function tick() {
      const now = new Date();
      const nowMins = now.getHours() * 60 + now.getMinutes();
      const nowSecs = now.getSeconds();

      const bedMins = getBedtimeMinutes();
      const startMins = getStartMinutes();

      // 総活動時間 (start → bed, 翌日にまたぐ場合も考慮)
      let totalMins = bedMins - startMins;
      if (totalMins <= 0) totalMins += 1440;

      // 残り時間 (now → bed)
      let remainingMins = bedMins - nowMins;
      if (remainingMins < 0) remainingMins += 1440;

      const remainingSecs = remainingMins * 60 - nowSecs;

      if (remainingSecs <= 0) {
        countdownEl.textContent = "00:00:00";
        progressEl.style.width = "0%";
        minutesLeftEl.textContent = "0";
        percentLeftEl.textContent = "0%";
        document.body.innerHTML = `<p class="done-message">お疲れ様でした。今日も1440分を生き切った。</p>`;
        return;
      }

      const dispH = Math.floor(remainingSecs / 3600);
      const dispM = Math.floor((remainingSecs % 3600) / 60);
      const dispS = remainingSecs % 60;
      countdownEl.textContent = `${pad(dispH)}:${pad(dispM)}:${pad(dispS)}`;

      const pct = Math.min(100, Math.max(0, (remainingMins / totalMins) * 100));
      progressEl.style.width = pct + "%";

      const elapsedMins = totalMins - remainingMins;
      elapsedEl.textContent = elapsedMins > 0 ? elapsedMins : 0;
      minutesLeftEl.textContent = remainingMins;
      percentLeftEl.textContent = Math.round(pct) + "%";

      // 色
      const colorClass = pct <= 10 ? "danger" : pct <= 25 ? "warning" : "";
      countdownEl.className = "countdown-time " + colorClass;
      progressEl.className = "progress-bar " + colorClass;

      messageEl.textContent = getMessages(remainingMins);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
